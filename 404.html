<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable | Garage Bouaïla</title>
    <meta name="description" content="La page demandée est introuvable sur Garage Bouaïla." />
    <style>
      :root {
        --bg: #050505;
        --panel: #101010;
        --text: #ffffff;
        --muted: #a1a1a1;
        --red: #e30613;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #171717, var(--bg) 50%);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .wrap {
        width: min(92vw, 720px);
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }
      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        background: rgba(227, 6, 19, 0.12);
        border: 1px solid rgba(227, 6, 19, 0.45);
        color: var(--red);
        border-radius: 999px;
        letter-spacing: 0.18em;
        font-size: 0.72rem;
        text-transform: uppercase;
        font-weight: 700;
      }
      h1 {
        font-size: clamp(2.4rem, 6vw, 4rem);
        margin: 1rem 0 0.8rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        text-decoration: none;
        background: var(--red);
        color: white;
        padding: 0.85rem 1.3rem;
        border-radius: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="badge">Garage Bouaïla</div>
      <h1>Page introuvable</h1>
      <p>La page que vous recherchez n’existe pas ou a été déplacée.</p>
      <a href="./index.html">Retour à l'accueil</a>
    </main>
  </body>
</html>
